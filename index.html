<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Pentecostal Church</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --primary: #5c1d24;
            --primary-light: #fdf6f6;
            --accent: #d9383a;
            --text-dark: #333333;
            --text-light: #666666;
            --bg-footer: #1e3f20;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: var(--text-dark);
            padding-bottom: 70px;
        }

        /* Header Navigation */
        header {
            background: var(--white);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }

        .btn-give {
            background: var(--accent);
            color: var(--white);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Hero Banner Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            color: var(--white);
            text-align: center;
            padding: 50px 20px;
        }

        .hero h1 {
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .hero p {
            font-size: 14px;
            opacity: 0.95;
        }

        /* Section Layouts */
        .section {
            padding: 25px 20px 5px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 0.8px;
            font-weight: bold;
        }

        .see-all {
            font-size: 12px;
            color: var(--text-light);
            text-decoration: none;
        }

        /* Daily Devotional Layout */
        .devotional-card {
            background: var(--primary-light);
            border-left: 4px solid var(--accent);
            padding: 18px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .devotional-date {
            color: var(--accent);
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .devotional-quote {
            font-style: italic;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.4;
        }

        .devotional-body {
            font-size: 13px;
            color: #444;
            line-height: 1.4;
        }

        /* Event Layout List */
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .event-card {
            background: var(--white);
            border: 1px solid #eee;
            border-radius: 8px;
            display: flex;
            padding: 12px;
            gap: 12px;
            align-items: center;
        }

        .event-date-box {
            background: var(--primary-light);
            color: var(--accent);
            min-width: 55px;
            height: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
        }

        .event-date-box .month { font-size: 10px; text-transform: uppercase; }
        .event-date-box .day { font-size: 16px; }

        .event-details { flex: 1; }
        .event-details .tag {
            font-size: 9px;
            text-transform: uppercase;
            background: #fff0f1;
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 4px;
        }
        .event-details h3 { font-size: 14px; margin-bottom: 3px; font-weight: 600; }
        .event-details p { font-size: 12px; color: var(--text-light); line-height: 1.3; }

        /* Ministries Layout Grid */
        .ministries-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .ministry-item {
            background: var(--white);
            border: 1px solid #eee;
            padding: 14px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
        }

        .ministry-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ministry-left i {
            color: #2e5930;
            font-size: 14px;
            width: 16px;
            text-align: center;
        }

        .ministry-item .fa-chevron-right {
            color: #ccc;
            font-size: 10px;
        }

        /* Community Photo Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .gallery-card {
            background: var(--white);
            border: 1px solid #eee;
            border-radius: 6px;
            overflow: hidden;
        }

        .gallery-card img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            display: block;
            background: #e0e0e0;
        }

        .gallery-label {
            font-size: 10px;
            padding: 6px 4px;
            text-align: center;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Address and Footer Section */
        footer {
            background: var(--bg-footer);
            color: var(--white);
            padding: 35px 20px 80px 20px;
            margin-top: 30px;
        }

        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .footer-content h2 { font-size: 20px; margin-bottom: 5px; font-weight: 500; }
        .footer-desc { font-size: 13px; opacity: 0.8; margin-bottom: 25px; line-height: 1.4; }
        .info-row { display: flex; gap: 12px; margin-bottom: 16px; font-size: 13px; align-items: flex-start; }
        .info-row i { color: #a2cba4; font-size: 14px; margin-top: 2px; width: 15px; text-align: center; }
        .info-row div p:first-child { font-weight: bold; margin-bottom: 2px; }
        .info-row div p:last-child { opacity: 0.85; }
        
        .social-row {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }
        .social-link { color: white; text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 6px; }

        .pastor-box {
            background: rgba(255,255,255,0.08);
            padding: 12px;
            border-radius: 6px;
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .pastor-avatar {
            width: 40px; height: 40px; background: #3b633e; border-radius: 5px;
            display: flex; align-items: center; justify-content: center; color: white;
            font-size: 18px;
        }

        .pastor-info p:first-child { font-size: 10px; text-transform: uppercase; opacity: 0.6; letter-spacing: 0.5px; }
        .pastor-info p:last-child { font-size: 14px; font-weight: bold; }

        /* App Action Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--white);
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 200;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-light);
            font-size: 10px;
            text-decoration: none;
            background: none;
            border: none;
            flex: 1;
            cursor: pointer;
        }

        .nav-item.active, .nav-item:hover { color: var(--accent); }
        .nav-item i { font-size: 16px; margin-bottom: 2px; }

        /* Control Panel Modal */
        #adminPanel {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
